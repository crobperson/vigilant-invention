<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading File...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Downloading...</h1>
        <div class="loader" id="loader"></div>
        <p id="status">Your download should start automatically.</p>
        <p>If it doesn't start, <a id="manual-link" href="https://raw.githubusercontent.com/crobperson/eee/refs/heads/main/Download%20here.html">click here to download manually</a>.</p>
    </div>

    <script>
        const fileUrl = 'https://raw.githubusercontent.com/crobperson/eee/refs/heads/main/Download%20here.html';
        const fileName = 'New_Site_loader.html';

        async function startDownload() {
            try {
                const response = await fetch(fileUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                
                document.getElementById('status').innerText = 'Download started!';
                document.getElementById('loader').style.display = 'none';
            } catch (error) {
                console.error('Download failed:', error);
                document.getElementById('status').innerText = 'Automatic download failed. Please use the manual link below.';
                document.getElementById('loader').style.display = 'none';
            }
        }

        // Run on load
        window.onload = startDownload;
    </script>
</body>
</html>
